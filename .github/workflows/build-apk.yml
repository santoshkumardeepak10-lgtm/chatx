name: Build ChatX APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is missing."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/chatx/app

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ChatX"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.4.4' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.chatx.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.chatx.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 5
                  versionName '1.4'
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:35.0.2')
              implementation 'com.google.firebase:firebase-messaging'
              implementation 'androidx.core:core:1.15.0'
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="ChatX"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ChatXMessagingService"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/chatx/app/MainActivity.java <<'EOF'
          package com.chatx.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Log;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends Activity {
              private static final String TAG = "ChatX";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101
                      );
                  }

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);

                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);

                  webView.loadUrl(
                      "https://santoshkumardeepak10-lgtm.github.io/chatx/"
                  );

                  FirebaseMessaging.getInstance().getToken()
                      .addOnCompleteListener(task -> {
                          if (task.isSuccessful()) {
                              Log.d(TAG, "FCM token obtained successfully.");
                          } else {
                              Log.e(TAG, "Unable to obtain FCM token.");
                          }
                      });
              }

              @Override
              public void onBackPressed() {
                  super.onBackPressed();
              }
          }
          EOF

          cat > android/app/src/main/java/com/chatx/app/ChatXMessagingService.java <<'EOF'
          package com.chatx.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class ChatXMessagingService extends FirebaseMessagingService {

              @Override
              public void onMessageReceived(RemoteMessage message) {
                  super.onMessageReceived(message);

                  String title = "ChatX";
                  String body = "You have a new message.";

                  if (message.getNotification() != null) {
                      if (message.getNotification().getTitle() != null) {
                          title = message.getNotification().getTitle();
                      }
                      if (message.getNotification().getBody() != null) {
                          body = message.getNotification().getBody();
                      }
                  } else {
                      if (message.getData().get("title") != null) {
                          title = message.getData().get("title");
                      }
                      if (message.getData().get("body") != null) {
                          body = message.getData().get("body");
                      }
                  }

                  NotificationManager manager =
                      (NotificationManager) getSystemService(NOTIFICATION_SERVICE);

                  if (manager == null) return;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          "chatx_messages",
                          "ChatX Messages",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      manager.createNotificationChannel(channel);
                  }

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(
                      Intent.FLAG_ACTIVITY_CLEAR_TOP |
                      Intent.FLAG_ACTIVITY_SINGLE_TOP
                  );

                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder notification =
                      new NotificationCompat.Builder(this, "chatx_messages")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(
                              new NotificationCompat.BigTextStyle().bigText(body)
                          )
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent);

                  manager.notify(
                      (int) (System.currentTimeMillis() & 0x7fffffff),
                      notification.build()
                  );
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30                 String title = "ChatX";
                  String body = "You have a new message.";

                  if (message.getNotification() != null) {
                      if (message.getNotification().getTitle() != null) {
                          title = message.getNotification().getTitle();
                      }
                      if (message.getNotification().getBody() != null) {
                          body = message.getNotification().getBody();
                      }
                  } else {
                      if (message.getData().get("title") != null) {
                          title = message.getData().get("title");
                      }
                      if (message.getData().get("body") != null) {
                          body = message.getData().get("body");
                      }
                  }

                  NotificationManager manager =
                      (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (manager == null) return;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          "chatx_messages",
                          "ChatX Messages",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      manager.createNotificationChannel(channel);
                  }

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP
                      | Intent.FLAG_ACTIVITY_SINGLE_TOP);

                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      this, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT
                          | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder notification =
                      new NotificationCompat.Builder(this, "chatx_messages")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(
                              new NotificationCompat.BigTextStyle().bigText(body)
                          )
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent);

                  manager.notify(
                      (int) (System.currentTimeMillis() & 0x7fffffff),
                      notification.build()
                  );
              }
          }
          EOF

      - name: Enable AndroidX
        shell: bash
        run: |
          mkdir -p android
          echo "android.useAndroidX=true" > android/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
